<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi QR</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{margin:0;background:#eef2f7;font-family:Arial;color:#111827}.top{background:#111827;color:#fff;text-align:center;padding:25px}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px #0001}select{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;font-size:16px}.ok{background:#dcfce7;padding:16px;border-radius:15px}.bad{background:#fee2e2;padding:16px;border-radius:15px}a{color:#2563eb}</style></head><body><header class="top"><h2>ABSENSI SEKOLAH</h2><div>SCAN QR SISWA</div></header><main class="wrap"><div class="card"><b>Jenis Absensi</b><select id="type"><option>DATANG</option><option>PULANG</option><option>DHUHA</option><option>ASHAR</option></select></div><div class="card"><div id="reader"></div><small>Izinkan kamera. GitHub Pages harus HTTPS.</small></div><div id="result"></div><div class="card" style="text-align:center"><a href="admin/">⚙️ ADMIN</a></div></main><script>const API='https://script.google.com/macros/s/AKfycbzfdkhW1QdHCuJK876VpUBo2vR_fpxqxsDIhUMEYSF_5yCvcBVea2f2TuMgwSVIw-yV/exec';let busy=false;async function post(action,data={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});return r.json()}function show(x){let e=document.getElementById('result');e.className='card '+(x.success?'ok':'bad');e.innerHTML=x.success?`<h3>✓ ABSEN BERHASIL</h3><b>${x.siswa.nama}</b><br>NIS: ${x.siswa.nis}<br>Kelas: ${x.siswa.kelas}<br>Jam: ${x.jam}<br>Status: <b>${x.status}</b>`:`<h3>⚠️ GAGAL</h3>${x.message}`;setTimeout(()=>e.innerHTML='',5000)}async function scan(token){if(busy)return;busy=true;try{show(await post('scan',{token,type:document.getElementById('type').value,device:navigator.userAgent}))}catch(e){show({success:false,message:e.message})}busy=false}new Html5Qrcode('reader').start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},scan).catch(()=>show({success:false,message:'Kamera tidak tersedia. Pastikan HTTPS dan izin kamera aktif.'}));</script></body></html>
