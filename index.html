<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Absensi</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{margin:0;background:#eef2f7;font-family:Arial;color:#111827}.top{background:#111827;color:white;padding:20px}.wrap{max-width:1200px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px #0001}.num{font-size:30px;font-weight:bold}input,button{width:100%;padding:11px;margin-top:7px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#111827;color:white;border:0}.danger{background:#991b1b}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.scroll{overflow:auto}.hide{display:none}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center}.modalbox{background:#fff;padding:25px;border-radius:18px;text-align:center;width:min(430px,90%)}#qrcode{display:flex;justify-content:center;margin:20px}</style></head><body><div id="login"><div class="wrap"><div class="card" style="max-width:400px;margin:70px auto"><h2>ADMIN ABSENSI</h2><input id="u" value="admin"><input id="p" type="password" placeholder="Password"><button onclick="login()">LOGIN</button><p id="msg"></p></div></div></div><div id="app" class="hide"><header class="top"><h2>ADMIN ABSENSI SEKOLAH</h2><span id="who"></span></header><main class="wrap"><div class="grid"><div class="card">Siswa<div class="num" id="n1">0</div></div><div class="card">Datang<div class="num" id="n2">0</div></div><div class="card">Belum<div class="num" id="n3">0</div></div><div class="card">Terlambat<div class="num" id="n4">0</div></div><div class="card">Dhuha<div class="num" id="n5">0</div></div><div class="card">Ashar<div class="num" id="n6">0</div></div></div><div class="card"><h3>Tambah Siswa</h3><div class="row"><input id="nis" placeholder="NIS"><input id="nisn" placeholder="NISN"><input id="nama" placeholder="Nama"><input id="kelas" placeholder="Kelas"><input id="jurusan" placeholder="Jurusan"><input id="jk" placeholder="JK"></div><button onclick="add()">SIMPAN SISWA + BUAT QR</button></div><div class="card"><h3>Data Siswa</h3><input id="search" oninput="render()" placeholder="Cari nama/NIS/kelas"><div class="scroll"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Status</th><th>QR</th><th>Aksi</th></tr></thead><tbody id="st"></tbody></table></div></div><div class="card"><h3>Rekap</h3><input id="date" type="date" onchange="load()"><button onclick="exportCSV()">EXPORT CSV</button><div class="scroll"><table><thead><tr><th>Jam</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Jenis</th><th>Status</th></tr></thead><tbody id="rk"></tbody></table></div></div><div class="card"><h3>Belum Absen Datang</h3><div class="scroll"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th></tr></thead><tbody id="bl"></tbody></table></div></div><div class="card"><h3>Pengaturan</h3><div class="row"><input id="school" placeholder="Nama Sekolah"><input id="late" placeholder="Batas Terlambat"></div><button onclick="saveSettings()">SIMPAN</button></div><div class="card"><h3>Ganti Password</h3><input id="newpass" type="password" placeholder="Password baru"><button onclick="changePass()">GANTI PASSWORD</button></div></main></div><div id="modal" class="modal hide"><div class="modalbox"><h2 id="qrname"></h2><div id="qrcode"></div><b id="qrtext"></b><button onclick="window.print()">CETAK QR</button><button onclick="closeQR()">TUTUP</button></div></div><script>const API='https://script.google.com/macros/s/AKfycbzfdkhW1QdHCuJK876VpUBo2vR_fpxqxsDIhUMEYSF_5yCvcBVea2f2TuMgwSVIw-yV/exec';let user,students=[];async function post(action,data={}){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...data})});return r.json()}function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Jakarta'})}async function login(){let x=await post('login',{username:u.value,password:p.value});if(x.success){user=x.user;document.getElementById('login').className='hide';app.className='';who.textContent=user.nama;date.value=today();load()}else msg.textContent=x.message}async function load(){let x=await post('dashboard',{date:date.value});if(x.success){n1.textContent=x.data.total;n2.textContent=x.data.datang;n3.textContent=x.data.belum;n4.textContent=x.data.terlambat;n5.textContent=x.data.dhuha;n6.textContent=x.data.ashar}x=await post('students');students=x.data||[];render();x=await post('rekap',{date:date.value});rk.innerHTML=(x.data||[]).map(a=>`<tr><td>${a.JAM}</td><td>${a.NIS}</td><td>${a.NAMA}</td><td>${a.KELAS}</td><td>${a.JENIS}</td><td>${a.STATUS}</td></tr>`).join('');x=await post('belum',{date:date.value});bl.innerHTML=(x.data||[]).map(a=>`<tr><td>${a.NIS}</td><td>${a.NAMA}</td><td>${a.KELAS}</td></tr>`).join('');x=await post('settings');school.value=x.data.NAMA_SEKOLAH||'';late.value=x.data.BATAS_TERLAMBAT||''}function render(){let q=(search.value||'').toLowerCase();st.innerHTML=students.filter(s=>(s.NIS+' '+s.NAMA+' '+s.KELAS).toLowerCase().includes(q)).map(s=>`<tr><td>${s.NIS}</td><td>${s.NAMA}</td><td>${s.KELAS}</td><td>${s.STATUS}</td><td><button onclick="showQR('${s.TOKEN_QR}','${String(s.NAMA).replace(/'/g,'')}')">🔳 QR</button></td><td><button class="danger" onclick="disableS('${s.ID_SISWA}')">Nonaktif</button><button onclick="resetS('${s.ID_SISWA}')">Reset QR</button></td></tr>`).join('')}async function add(){let x=await post('add',{nis:nis.value,nisn:nisn.value,nama:nama.value,kelas:kelas.value,jurusan:jurusan.value,jk:jk.value});if(x.success){alert('Siswa tersimpan dan QR dibuat');load()}else alert(x.message)}async function disableS(id){if(confirm('Nonaktifkan?')){await post('disable',{id});load()}}async function resetS(id){if(confirm('Reset QR lama?')){let x=await post('resetqr',{id});alert(x.success?'QR baru dibuat':x.message);load()}}function showQR(token,name){document.getElementById('qrname').textContent=name;document.getElementById('qrtext').textContent=token;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:token,width:280,height:280});document.getElementById('modal').className='modal'}function closeQR(){document.getElementById('modal').className='modal hide'}async function exportCSV(){let x=await post('rekap',{date:date.value});let h='Tanggal,Jam,NIS,Nama,Kelas,Jenis,Status\n',t=x.data.map(a=>[a.TANGGAL,a.JAM,a.NIS,a.NAMA,a.KELAS,a.JENIS,a.STATUS].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');let z=document.createElement('a');z.href='data:text/csv;charset=utf-8,'+encodeURIComponent(h+t);z.download='rekap-'+date.value+'.csv';z.click()}async function saveSettings(){let x=await post('savesettings',{data:{NAMA_SEKOLAH:school.value,BATAS_TERLAMBAT:late.value}});alert(x.success?'Tersimpan':x.message)}async function changePass(){let x=await post('changepass',{id:user.id,password:newpass.value});alert(x.success?'Password diganti':x.message)}</script></body></html>
